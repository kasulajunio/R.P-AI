name: Requested Alpine install smoke
on:
  push:
    branches: [test/alpine-install-smoke]
    paths:
      - .github/workflows/alpine-install-smoke.yml
      - scripts/alpine-requested-smoke.sh
permissions:
  contents: read
jobs:
  requested-script:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact requested script in Alpine 3.22
        id: original
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker run --rm -e GH_TOKEN -v "$GITHUB_WORKSPACE/scripts/alpine-requested-smoke.sh:/check.sh:ro" alpine:3.22 sh -ec "apk add --no-cache bash >/dev/null; bash /check.sh"
      - name: Retry with Alpine package correction only
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<"PY"
          import pathlib
          p = pathlib.Path("scripts/alpine-requested-smoke.sh")
          pathlib.Path("scripts/alpine-corrected-smoke.sh").write_text(p.read_text().replace("py3-venv ", ""), encoding="utf-8")
          PY
          docker run --rm -e GH_TOKEN -v "$GITHUB_WORKSPACE/scripts/alpine-corrected-smoke.sh:/check.sh:ro" alpine:3.22 sh -ec "apk add --no-cache bash >/dev/null; bash /check.sh"
      - name: Record original result separately
        if: always()
        env:
          ORIGINAL: ${{ steps.original.outcome }}
        run: echo "Original script outcome $ORIGINAL. Target 8c378b7691979ca151c5a5aea0ed7ae010ba57ff. No Android device touched." >> "$GITHUB_STEP_SUMMARY"
