name: Corrected Alpine install smoke
on:
  push:
    branches: [test/alpine-install-smoke]
permissions:
  contents: read
jobs:
  corrected-alpine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Corrected install and complete regression in Alpine 3.22
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker run --rm -e GH_TOKEN -v "$GITHUB_WORKSPACE/scripts/alpine-corrected-smoke.sh:/check.sh:ro" alpine:3.22 sh -ec "apk add --no-cache bash >/dev/null; bash /check.sh $GITHUB_SHA"
      - name: Record scope and historical baseline
        if: always()
        run: |
          echo "Corrected test targets $GITHUB_SHA, not historical 8c378b7. Baseline failure retained at run 41730676108. Alpine container only; Android/Termux device not accessed." >> "$GITHUB_STEP_SUMMARY"
