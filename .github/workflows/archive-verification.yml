name: Approved archive verification
on:
  push:
    branches: [feat/official-foundation]
    paths:
      - official_core/forge_archives.py
      - tests/test_forge_archives.py
      - scripts/verify_archive_download.py
      - .github/workflows/archive-verification.yml
permissions:
  contents: read
jobs:
  native-arm64:
    if: contains(github.event.head_commit.message, [verify-archives-once])
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - name: Offline regression tests
        run: python -m unittest discover -s tests -p test_forge*.py -v
      - name: Explicit real download and native ARM64 execution
        env:
          PYTHONPATH: .
        run: python scripts/verify_archive_download.py
