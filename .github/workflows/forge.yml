name: Forge validation
on:
  pull_request:
    paths:
      - official_core/forge.py
      - official_core/console.py
      - official_core/launcher.py
      - rpa.py
      - pyproject.toml
      - tests/test_forge*.py
      - .github/workflows/forge.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  forge:
    name: Forge / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile module and integration
        run: python -m py_compile official_core/forge.py official_core/console.py tests/test_forge.py tests/test_forge_cli.py
      - name: Offline Forge and CLI tests
        run: python -m unittest discover -s tests -p "test_forge*.py" -v
      - name: Verify product CLI help without downloads
        run: python rpa.py forge --help
      - name: Verify standalone CLI help without downloads
        run: python -m official_core.forge --help
