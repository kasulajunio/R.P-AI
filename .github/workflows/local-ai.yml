name: Local AI verification
on:
  push:
    branches: [feat/official-foundation]
    paths: [official_core/local_ai.py, official_core/assistant_cli.py, official_core/console.py, tests/test_assistant.py, scripts/ai_smoke.py, .github/workflows/local-ai.yml]
  pull_request:
    paths: [official_core/local_ai.py, official_core/assistant_cli.py, official_core/console.py, tests/test_assistant.py, scripts/ai_smoke.py, .github/workflows/local-ai.yml]
permissions:
  contents: read
concurrency:
  group: local-ai-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-inference:
    name: Real CPU inference and miniapp browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MODELS: ${{ runner.temp }}/rpa-models
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline unit regression
        run: python -m unittest discover -s tests -p test_assistant.py -v
      - name: Download pinned official Ollama and verify SHA-256
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/ollama.tar.zst" https://github.com/ollama/ollama/releases/download/v0.40.14/ollama-linux-amd64.tar.zst
          printf "993e83d08c3d13d17c55009a3e2664c8a25445e644aec3a68bef5abb6abce67d  %s\n" "$RUNNER_TEMP/ollama.tar.zst" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/ollama"
          tar --zstd -xf "$RUNNER_TEMP/ollama.tar.zst" -C "$RUNNER_TEMP/ollama"
          "$RUNNER_TEMP/ollama/bin/ollama" serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:11434/api/version; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:11434/api/version
      - name: Explicit test-model download (CI runner only)
        run: "$RUNNER_TEMP/ollama/bin/ollama" pull qwen2.5-coder:0.5b
      - name: Genuine inference, HTML generation and browser interaction
        run: python scripts/ai_smoke.py
      - name: Evidence, no model files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-ai-evidence
          path: ai-evidence.json
          if-no-files-found: ignore
